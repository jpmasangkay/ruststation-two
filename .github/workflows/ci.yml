name: CI

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-gate:
    name: Build, Test & Phase 1 Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Toolchain bumps are deliberate and happen in their own commit (keep in sync with rust-toolchain.toml).
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Build release ps2-autotest binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p ps2-autotest

      - name: Upload Windows ps2-autotest binary artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ps2-autotest-windows-x86_64
          path: target/release/ps2-autotest.exe
          if-no-files-found: error

      - name: Clone ps2autotests
        run: git clone --depth 1 https://github.com/unknownbrackets/ps2autotests.git local/ps2autotests

      - name: Run Hardware Gate (52 suites)
        run: cargo run --release -p ps2-autotest -- --gate
