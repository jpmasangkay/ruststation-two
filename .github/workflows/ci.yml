name: CI

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-gate:
    name: Build, Test & Phase 1 Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Clone ps2autotests
        run: git clone --depth 1 https://github.com/unknownbrackets/ps2autotests.git local/ps2autotests

      - name: Run Hardware Gate (52 suites)
        run: cargo run --release -p ps2-autotest -- --gate
