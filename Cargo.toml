[workspace]
resolver = "2"
members = [
    "crates/ps2-common",
    "crates/ps2-core",
    "crates/ps2-autotest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitflags = "2.6"
bytemuck = { version = "1.19", features = ["derive", "min_const_generics"] }
clap = { version = "4.5", features = ["derive"] }
similar = "2.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
